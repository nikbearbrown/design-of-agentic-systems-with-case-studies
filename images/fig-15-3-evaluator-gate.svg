<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="x" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/></marker>
    <marker id="xr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#a83838"/></marker>
    <marker id="xg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6a4a"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>

  <text x="500" y="40" text-anchor="middle" font-size="27" font-weight="700" fill="#1a1a1a">The Evaluator Guardian — a citation-required gate</text>
  <text x="500" y="67" text-anchor="middle" font-size="16" font-style="italic" fill="#6b6b6b">Cheap deterministic checks first; the expensive semantic check runs only on what survives.</text>

  <!-- Finding -->
  <rect x="28" y="232" width="138" height="76" rx="8" fill="#ededed" stroke="#4a4a4a" stroke-width="2"/>
  <text x="97" y="264" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Finding</text>
  <text x="97" y="285" text-anchor="middle" font-size="12" fill="#555">from an agent</text>
  <line x1="166" y1="270" x2="198" y2="270" stroke="#3a3a3a" stroke-width="2" marker-end="url(#x)"/>

  <!-- Layer 1 -->
  <rect x="200" y="170" width="250" height="200" rx="8" fill="#eef2f6" stroke="#3a5e86" stroke-width="2"/>
  <text x="325" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#274970">Layer 1 — programmatic</text>
  <text x="222" y="232" font-size="13.5" fill="#33506f">• citation present?</text>
  <text x="222" y="262" font-size="13.5" fill="#33506f">• fix length ≥ 20 chars?</text>
  <text x="222" y="292" font-size="13.5" fill="#33506f">• confidence ≥ 0.5?</text>
  <text x="222" y="322" font-size="13.5" fill="#33506f">• schema valid?</text>
  <text x="325" y="352" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6b6b6b">fast · deterministic</text>
  <line x1="450" y1="270" x2="486" y2="270" stroke="#3a3a3a" stroke-width="2" marker-end="url(#x)"/>
  <text x="468" y="258" text-anchor="middle" font-size="11" fill="#555">if all pass</text>

  <!-- Layer 2 -->
  <rect x="488" y="200" width="244" height="140" rx="8" fill="#eef2f6" stroke="#3a5e86" stroke-width="2"/>
  <text x="610" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#274970">Layer 2 — LLM semantic</text>
  <text x="610" y="262" text-anchor="middle" font-size="13" fill="#33506f">does the cited passage</text>
  <text x="610" y="282" text-anchor="middle" font-size="13" fill="#33506f">actually support the claim?</text>
  <text x="610" y="314" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6b6b6b">expensive · runs only here</text>

  <!-- PASS -->
  <rect x="800" y="158" width="172" height="74" rx="8" fill="#d4e6db" stroke="#2f6a4a" stroke-width="2.5"/>
  <text x="886" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#1f5e3a">Ship to user</text>
  <text x="886" y="211" text-anchor="middle" font-size="12" fill="#2f5e46">finding + its citation</text>
  <path d="M732 250 C 766 250, 770 205, 800 195" fill="none" stroke="#2f6a4a" stroke-width="2.5" marker-end="url(#xg)"/>
  <text x="772" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f6a4a">PASS</text>

  <!-- FAIL box -->
  <rect x="560" y="404" width="412" height="86" rx="8" fill="#ecd0d0" stroke="#a83838" stroke-width="2.5"/>
  <text x="766" y="434" text-anchor="middle" font-size="15" font-weight="700" fill="#8f2a2a">Reject with structured feedback</text>
  <text x="766" y="458" text-anchor="middle" font-size="12.5" fill="#7a2a2a">upstream agent retries (≤ 3) · then a circuit breaker halts</text>
  <text x="766" y="478" text-anchor="middle" font-size="11.5" font-style="italic" fill="#8f2a2a">a finding without a verifiable citation never reaches the user</text>

  <!-- reject arrows from both layers -->
  <path d="M325 370 C 325 420, 470 430, 558 440" fill="none" stroke="#a83838" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#xr)"/>
  <path d="M610 340 C 610 372, 640 392, 640 402" fill="none" stroke="#a83838" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#xr)"/>
  <text x="455" y="408" text-anchor="middle" font-size="11.5" font-weight="700" fill="#a83838">fail either layer → reject</text>

  <!-- bottom note -->
  <text x="500" y="528" text-anchor="middle" font-size="13" fill="#3a3a3a">The agent that <tspan font-style="italic">produces</tspan> a claim is not the agent that <tspan font-style="italic">judges</tspan> it — a different agent, prompt, and objective,</text>
  <text x="500" y="547" text-anchor="middle" font-size="13" fill="#3a3a3a">so production-time and adjudication-time hallucinations do not correlate.</text>
</svg>
